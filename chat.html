<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat | glowElephant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'JetBrains Mono', monospace;
      background: #0d1117;
      color: #e6edf3;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 20px;
      background: #161b22;
      border-bottom: 1px solid #30363d;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .header-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: linear-gradient(135deg, #1a73e8, #34a853);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 700;
      color: #fff;
    }

    .header-name {
      font-size: 14px;
      font-weight: 700;
      color: #e6edf3;
    }

    .header-status {
      font-size: 11px;
      color: #8b949e;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #3fb950;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .header-links {
      display: flex;
      gap: 10px;
    }

    .header-links a {
      color: #8b949e;
      text-decoration: none;
      font-size: 12px;
      padding: 4px 10px;
      border: 1px solid #30363d;
      border-radius: 6px;
      transition: all 0.2s;
    }

    .header-links a:hover {
      color: #e6edf3;
      border-color: #58a6ff;
    }

    .chat-area {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .welcome {
      text-align: center;
      padding: 60px 20px;
    }

    .welcome-icon {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: linear-gradient(135deg, #1a73e8, #34a853);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: 700;
      color: #fff;
      margin: 0 auto 16px;
    }

    .welcome h3 {
      font-size: 18px;
      margin-bottom: 8px;
      color: #e6edf3;
    }

    .welcome p {
      font-size: 13px;
      color: #8b949e;
      margin-bottom: 4px;
    }

    .suggestions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin-top: 20px;
    }

    .suggestion {
      background: #161b22;
      border: 1px solid #30363d;
      color: #8b949e;
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.2s;
    }

    .suggestion:hover {
      border-color: #58a6ff;
      color: #58a6ff;
    }

    .msg {
      display: flex;
      gap: 10px;
      max-width: 85%;
      animation: fadeIn 0.3s;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .msg-user {
      align-self: flex-end;
      flex-direction: row-reverse;
    }

    .msg-avatar {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: linear-gradient(135deg, #1a73e8, #34a853);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: 700;
      color: #fff;
      flex-shrink: 0;
    }

    .msg-bubble {
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 13px;
      line-height: 1.6;
      word-break: break-word;
    }

    .msg-assistant .msg-bubble {
      background: #161b22;
      border: 1px solid #30363d;
      border-top-left-radius: 4px;
    }

    .msg-user .msg-bubble {
      background: #1a73e8;
      color: #fff;
      border-top-right-radius: 4px;
    }

    .msg-bubble code { background: #0d1117; padding: 2px 5px; border-radius: 3px; font-size: 12px; }
    .msg-bubble strong { color: #58a6ff; }

    .chat-error {
      color: #f85149;
      font-size: 12px;
    }

    .typing span {
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #8b949e;
      animation: typing 1.2s infinite;
      margin: 0 2px;
    }

    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes typing {
      0%, 60%, 100% { opacity: 0.3; transform: translateY(0); }
      30% { opacity: 1; transform: translateY(-4px); }
    }

    .input-area {
      padding: 16px 20px;
      background: #161b22;
      border-top: 1px solid #30363d;
      display: flex;
      gap: 10px;
    }

    .input-area textarea {
      flex: 1;
      background: #0d1117;
      border: 1px solid #30363d;
      color: #e6edf3;
      padding: 10px 14px;
      border-radius: 8px;
      font-family: inherit;
      font-size: 13px;
      resize: none;
      outline: none;
      line-height: 1.5;
    }

    .input-area textarea:focus { border-color: #58a6ff; }
    .input-area textarea::placeholder { color: #484f58; }

    .send-btn {
      width: 40px;
      height: 40px;
      border-radius: 8px;
      border: none;
      background: #1a73e8;
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      flex-shrink: 0;
    }

    .send-btn:disabled { opacity: 0.3; cursor: not-allowed; }
    .send-btn:not(:disabled):hover { background: #1565c0; }

    @media (max-width: 600px) {
      .msg { max-width: 95%; }
      .header-links { display: none; }
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="header-left">
      <div class="header-avatar">gE</div>
      <div>
        <div class="header-name">glowElephant Assistant</div>
        <div class="header-status">
          <span class="status-dot"></span>
          <span id="statusText">Online</span>
        </div>
      </div>
    </div>
    <div class="header-links">
      <a href="https://glowelephant.site" target="_blank">Portfolio</a>
      <a href="https://github.com/glowElephant" target="_blank">GitHub</a>
    </div>
  </div>

  <div class="chat-area" id="chatArea">
    <div class="welcome" id="welcome">
      <div class="welcome-icon">gE</div>
      <h3>glowElephant Assistant</h3>
      <p>장한아에 대해 궁금한 점을 물어보세요.</p>
      <p>경력, 기술 스택, 프로젝트, 협업 문의 등</p>
      <div class="suggestions">
        <button class="suggestion" data-msg="어떤 기술 스택을 사용하나요?">기술 스택</button>
        <button class="suggestion" data-msg="주요 프로젝트를 소개해주세요">프로젝트 소개</button>
        <button class="suggestion" data-msg="외주 개발 가능한가요?">외주 문의</button>
        <button class="suggestion" data-msg="경력이 어떻게 되나요?">경력 소개</button>
      </div>
    </div>
  </div>

  <div class="input-area">
    <textarea id="input" placeholder="메시지를 입력하세요..." rows="1"></textarea>
    <button class="send-btn" id="sendBtn" disabled>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/>
      </svg>
    </button>
  </div>

  <script>
  (function() {
    const API = 'https://glowelephant.site/api/chat';
    const SESSION_TTL = 24 * 60 * 60 * 1000;
    const chatArea = document.getElementById('chatArea');
    const input = document.getElementById('input');
    const sendBtn = document.getElementById('sendBtn');
    const statusText = document.getElementById('statusText');
    let isStreaming = false;

    function getSession() {
      const stored = localStorage.getItem('gh_chat_session');
      if (stored) {
        const s = JSON.parse(stored);
        if (Date.now() - s.created < SESSION_TTL) return s;
      }
      const session = {
        id: 'gh_' + Math.random().toString(36).slice(2) + '_' + Date.now(),
        created: Date.now(),
        messages: []
      };
      localStorage.setItem('gh_chat_session', JSON.stringify(session));
      return session;
    }

    function saveSession(s) {
      localStorage.setItem('gh_chat_session', JSON.stringify(s));
    }

    let session = getSession();

    if (session.messages.length > 0) {
      document.getElementById('welcome').style.display = 'none';
      session.messages.forEach(m => appendMessage(m.role, m.content, false));
    }

    input.addEventListener('input', () => {
      input.style.height = 'auto';
      input.style.height = Math.min(input.scrollHeight, 120) + 'px';
      sendBtn.disabled = !input.value.trim();
    });

    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        if (!isStreaming && input.value.trim()) sendMessage();
      }
    });

    sendBtn.addEventListener('click', () => {
      if (!isStreaming && input.value.trim()) sendMessage();
    });

    function bindSuggestions() {
      document.querySelectorAll('.suggestion').forEach(btn => {
        btn.addEventListener('click', () => {
          input.value = btn.dataset.msg;
          sendBtn.disabled = false;
          sendMessage();
        });
      });
    }
    bindSuggestions();

    function escapeHtml(str) {
      return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    function formatContent(text) {
      text = text.replace(/<!--CONTACT:.*?-->/g, '');
      text = text.replace(/<!--FORWARD_CHATLOG:.*?-->/g, '');
      return escapeHtml(text)
        .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
        .replace(/`(.*?)`/g, '<code>$1</code>')
        .replace(/\n/g, '<br>');
    }

    function appendMessage(role, content, save = true) {
      const div = document.createElement('div');
      div.className = `msg msg-${role}`;
      if (role === 'assistant') {
        div.innerHTML = `<div class="msg-avatar">gE</div><div class="msg-bubble">${formatContent(content)}</div>`;
      } else {
        div.innerHTML = `<div class="msg-bubble">${escapeHtml(content)}</div>`;
      }
      chatArea.appendChild(div);
      chatArea.scrollTop = chatArea.scrollHeight;
      if (save) {
        session.messages.push({ role, content });
        saveSession(session);
      }
      return div;
    }

    async function sendMessage() {
      const text = input.value.trim();
      if (!text || isStreaming) return;

      const welcome = document.getElementById('welcome');
      if (welcome) welcome.style.display = 'none';

      appendMessage('user', text);
      input.value = '';
      input.style.height = 'auto';
      sendBtn.disabled = true;
      isStreaming = true;
      statusText.textContent = 'Typing...';

      const msgDiv = document.createElement('div');
      msgDiv.className = 'msg msg-assistant';
      msgDiv.innerHTML = '<div class="msg-avatar">gE</div><div class="msg-bubble"><span class="typing"><span></span><span></span><span></span></span></div>';
      chatArea.appendChild(msgDiv);
      chatArea.scrollTop = chatArea.scrollHeight;
      const bubble = msgDiv.querySelector('.msg-bubble');

      try {
        const apiMessages = session.messages.map(m => ({ role: m.role, content: m.content }));
        const response = await fetch(API, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ messages: apiMessages, sessionId: session.id })
        });

        if (!response.ok) {
          const err = await response.json();
          bubble.innerHTML = `<span class="chat-error">${err.error || 'Error occurred'}</span>`;
          isStreaming = false;
          statusText.textContent = 'Online';
          return;
        }

        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let fullContent = '';
        bubble.innerHTML = '';

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          const chunk = decoder.decode(value, { stream: true });
          const lines = chunk.split('\n');
          for (const line of lines) {
            if (!line.startsWith('data: ')) continue;
            if (line === 'data: [DONE]') continue;
            try {
              const json = JSON.parse(line.slice(6));
              const delta = json.choices?.[0]?.delta?.content;
              if (delta) {
                fullContent += delta;
                bubble.innerHTML = formatContent(fullContent);
                chatArea.scrollTop = chatArea.scrollHeight;
              }
            } catch (e) {}
          }
        }

        session.messages.push({ role: 'assistant', content: fullContent });
        saveSession(session);
      } catch (err) {
        bubble.innerHTML = '<span class="chat-error">AI 어시스턴트에 연결할 수 없습니다. 잠시 후 다시 시도해주세요.</span>';
      }

      isStreaming = false;
      statusText.textContent = 'Online';
    }
  })();
  </script>
</body>
</html>
